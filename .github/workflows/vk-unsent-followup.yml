name: Previously unsent VK free-service follow-up

# This job will not run merely because the workflow is added. Its unique
# marker and commit subject are required, and the Python guard verifies that
# the previous real campaign completed with no possible SMMnakrutka submission.
on:
  push:
    branches:
      - arena/e372c48b-vkkk
    paths:
      - .github/vk-unsent-followup-club243396555.once

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: vk-live-club243396555
  cancel-in-progress: false

jobs:
  unsent-followup:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'luxuryprince666/Vkkk' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'Run unsent VK follow-up verification')
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      VKFREE_DATA: /tmp/vkkk-unsent-db
      VKKK_PROGRESS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vkci-env"
          "$RUNNER_TEMP/vkci-env/bin/python" -m pip install --disable-pip-version-check playwright==1.65.2 curl_cffi==0.17.0
          echo "$RUNNER_TEMP/vkci-env/bin" >> "$GITHUB_PATH"
          if ! command -v google-chrome && ! command -v google-chrome-stable && ! command -v chromium && ! command -v chromium-browser; then
            "$RUNNER_TEMP/vkci-env/bin/python" -m playwright install chromium
          fi
      - name: Test duplicate-order and free-form guards
        run: |
          python -m unittest discover -s tests -p 'test_unsent_followup.py' -q
          python -m unittest discover -s tests -p 'test_verifier.py' -q
          python -m unittest discover -s tests -p 'test_live_ci.py' -q
          python -m unittest discover -s tests -p 'test_free_form_safety.py' -q
      - name: Verify previous completed state and test only the unsent site
        env:
          VKKK_LIVE_RUN: authorized-once
          VKKK_UNSENT_FOLLOWUP: smmnakrutka-only
        run: python tools/run_unsent_followup_ci.py --output-dir /tmp/vkkk-unsent-report
      - name: Publish final report
        if: always()
        run: python tools/ci_emit_report.py /tmp/vkkk-unsent-report/vk-live-report.json
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-unsent-followup-report
          path: /tmp/vkkk-unsent-report/vk-live-report.*
          if-no-files-found: ignore
          retention-days: 7
