name: SMMnakrutka free popup diagnostic (no orders)

# Record only blocked request hosts/paths and requirement flags, never tokens.
on:
  push:
    branches:
      - arena/e372c48b-vkkk
    paths:
      - .github/workflows/vk-smmnakrutka-readonly.yml

permissions:
  contents: read
  checks: write

jobs:
  popup-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VKFREE_DATA: /tmp/vkkk-popup-probe
      VKKK_PROGRESS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vkci-env"
          "$RUNNER_TEMP/vkci-env/bin/python" -m pip install --disable-pip-version-check playwright==1.65.2 curl_cffi==0.17.0
          echo "$RUNNER_TEMP/vkci-env/bin" >> "$GITHUB_PATH"
          if ! command -v google-chrome && ! command -v google-chrome-stable && ! command -v chromium && ! command -v chromium-browser; then
            "$RUNNER_TEMP/vkci-env/bin/python" -m playwright install chromium
          fi
      - name: Test close-control and ordering safeguards offline
        run: python -m unittest discover -s tests -p 'test_free_form_safety.py' -q
      - name: Observe popup without entering a link or submitting
        run: python tools/ci_smmnakrutka_probe.py
