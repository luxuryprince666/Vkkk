name: One-off VK sequential verification

# This is a one-time real-order campaign for the specific community below.
# Editing the workflow alone does not start it; the unique marker and exact
# commit subject are required. GitHub reruns are explicitly blocked.
on:
  push:
    branches:
      - arena/e372c48b-vkkk
    paths:
      - .github/vk-live-club243396555.once

permissions:
  contents: read
  checks: write

concurrency:
  group: vk-live-club243396555
  cancel-in-progress: false

jobs:
  live-verification:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'luxuryprince666/Vkkk' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'Run one-off VK live verification')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      VKFREE_DATA: /tmp/vkkk-live-db
      VKKK_PROGRESS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vkci-env"
          "$RUNNER_TEMP/vkci-env/bin/python" -m pip install --disable-pip-version-check playwright==1.65.2 curl_cffi==0.17.0
          echo "$RUNNER_TEMP/vkci-env/bin" >> "$GITHUB_PATH"
          if ! command -v google-chrome && ! command -v google-chrome-stable && ! command -v chromium && ! command -v chromium-browser; then
            "$RUNNER_TEMP/vkci-env/bin/python" -m playwright install chromium
          fi
      - name: Verify safeguards with offline test forms
        run: |
          python -m unittest discover -s tests -p 'test_verifier.py' -q
          python -m unittest discover -s tests -p 'test_live_ci.py' -q
          python -m unittest discover -s tests -p 'test_ci_progress.py' -q
          python -m unittest discover -s tests -p 'test_free_form_safety.py' -q
      - name: Measure and verify free services sequentially
        env:
          VKKK_LIVE_RUN: authorized-once
        run: >-
          python tools/run_live_ci.py
          --target https://vk.ru/club243396555
          --output-dir /tmp/vkkk-live-report
          --max-seconds 18000
      - name: Publish final report in a fresh annotation step
        if: always()
        run: python tools/ci_emit_report.py /tmp/vkkk-live-report/vk-live-report.json
      - name: Save the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-sequential-verification-report
          path: /tmp/vkkk-live-report/vk-live-report.*
          if-no-files-found: ignore
          retention-days: 7
