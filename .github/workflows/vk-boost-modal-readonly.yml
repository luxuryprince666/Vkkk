name: Boost-Like trial UI inspection (no order)

# Load the publicly advertised free page without entering a target. Block all
# non-GET traffic initially, then all browser traffic before opening the single
# scoped free-trial UI control. Never click a paid form or submit a link.
on:
  push:
    branches:
      - arena/e372c48b-vkkk
    paths:
      - .github/workflows/vk-boost-modal-readonly.yml

permissions:
  contents: read
  checks: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VKKK_PROGRESS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vkci-env"
          "$RUNNER_TEMP/vkci-env/bin/python" -m pip install --disable-pip-version-check playwright==1.65.2 curl_cffi==0.17.0
          echo "$RUNNER_TEMP/vkci-env/bin" >> "$GITHUB_PATH"
          if ! command -v google-chrome && ! command -v google-chrome-stable && ! command -v chromium && ! command -v chromium-browser; then
            "$RUNNER_TEMP/vkci-env/bin/python" -m playwright install chromium
          fi
      - name: Inspect the free trial without target or outbound requests after opening
        run: python tools/ci_boost_modal_readonly.py
