name: VK safely quarantined sequential remainder

# Real orders are possible. This workflow does not run merely by adding it:
# the unique marker path and matching commit subject are required. The Python
# guard validates all previous runs, forbids duplicates, waits at least an hour
# after the cancelled runner, and never retries previously possible orders.
on:
  push:
    branches:
      - arena/e372c48b-vkkk
    paths:
      - .github/vk-resume-club243396555.once

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: vk-live-club243396555
  cancel-in-progress: false

jobs:
  resume-sequentially:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'luxuryprince666/Vkkk' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'Run safely quarantined VK remainder')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VKFREE_DATA: /tmp/vkkk-resume-after-cancel-db
      VKKK_PROGRESS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vkci-env"
          "$RUNNER_TEMP/vkci-env/bin/python" -m pip install --disable-pip-version-check playwright==1.65.2 curl_cffi==0.17.0
          echo "$RUNNER_TEMP/vkci-env/bin" >> "$GITHUB_PATH"
          if ! command -v google-chrome && ! command -v google-chrome-stable && ! command -v chromium && ! command -v chromium-browser; then
            "$RUNNER_TEMP/vkci-env/bin/python" -m playwright install chromium
          fi
      - name: Test guards and observation offline
        run: |
          python -m unittest discover -s tests -p 'test_resume_after_cancel_ci.py' -q
          python -m unittest discover -s tests -p 'test_continuation_ci.py' -q
          python -m unittest discover -s tests -p 'test_verifier.py' -q
          python -m unittest discover -s tests -p 'test_ci_progress.py' -q
          python -m unittest discover -s tests -p 'test_free_form_safety.py' -q
      - name: Observe prior uncertainty and try unstarted sites sequentially
        env:
          VKKK_LIVE_RUN: authorized-once
          VKKK_RESUME_AFTER_CANCEL: quarantine-and-unattempted-only
        run: python tools/run_resume_after_cancel_ci.py --output-dir /tmp/vkkk-resume-after-cancel-report
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-resume-after-cancel-report
          path: /tmp/vkkk-resume-after-cancel-report/vk-continuation.*
          if-no-files-found: ignore
          retention-days: 7
