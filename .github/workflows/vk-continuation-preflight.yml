name: VK continuation preflight (read only)

# Public VK counters and catalogue checks only: no service form is opened.
on:
  push:
    branches:
      - arena/e372c48b-vkkk
    paths:
      - .github/workflows/vk-continuation-preflight.yml

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VKFREE_DATA: /tmp/vkkk-continuation-preflight-db
      VKKK_PROGRESS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vkci-env"
          "$RUNNER_TEMP/vkci-env/bin/python" -m pip install --disable-pip-version-check playwright==1.65.2 curl_cffi==0.17.0
          echo "$RUNNER_TEMP/vkci-env/bin" >> "$GITHUB_PATH"
          if ! command -v google-chrome && ! command -v google-chrome-stable && ! command -v chromium && ! command -v chromium-browser; then
            "$RUNNER_TEMP/vkci-env/bin/python" -m playwright install chromium
          fi
      - name: Check continuation logic without ordering
        run: |
          python -m unittest discover -s tests -p 'test_continuation_ci.py' -q
          python tools/ci_continuation_preflight.py
